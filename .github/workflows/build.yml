name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'

      - name: Build Forge mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: InvalidSessionFix-1.1.0
          path: build/libs/InvalidSessionFix-1.1.0.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 \
            build/libs/InvalidSessionFix-1.1.0.jar \
            --target "$GITHUB_SHA" \
            --title "InvalidSessionFix v1.1.0" \
            --notes "Fix fuer MultiMC Account-Ablauf: Die Mod liest oder veraendert accounts.json nicht mehr. InvalidSessionFix nutzt nach einmaligem /sessionfix login einen eigenen Microsoft Device-Flow Refresh-Token und kann die laufende Minecraft-Session weiterhin automatisch erneuern."
